name: Sign dry run (test key)

# Runs on every pull request with a throwaway encrypted key. It never reads a
# signing environment or secret, so a PR cannot reach production key material.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sign-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-key:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install pinned minisign
        uses: ./.github/actions/install-minisign

      - name: Prepare, sign, verify, and tamper-check with a throwaway key
        run: python scripts/sign.py --test-key
