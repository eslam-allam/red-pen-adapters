name: Release signed registry

on:
  push:
    tags:
      - "registry-v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0

      - name: Install pinned minisign
        uses: ./.github/actions/install-minisign

      - name: Validate the tagged registry and signature
        run: |
          set -euo pipefail
          python scripts/registry.py format --check registry.json registry.config.json
          python scripts/update.py --check
          python scripts/validate.py --require-signature

      - name: Check checksums and release metadata
        run: |
          set -euo pipefail
          sha256sum --check --strict registry.sha256
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import registry

          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          assert release["registrySha256"] == registry.sha256_file("registry.json")
          assert release["signatureSha256"] == registry.sha256_file("registry.json.minisig")
          assert release["tag"] == f"registry-v{release['sequence']}"
          print(f"release metadata matches {release['tag']}")
          PY

      - name: Verify with the committed public key
        run: python scripts/verify.py --json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            registry.json \
            registry.json.minisig \
            registry.sha256 \
            release.json \
            keys/*.pub \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "Signed Red Pen adapter registry ${GITHUB_REF_NAME}. Verify registry.json with registry.json.minisig and the committed public key."
