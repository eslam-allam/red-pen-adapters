name: Validate adapter schemas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema validator and Lua compiler
        run: |
          python -m pip install jsonschema
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Check generated language adapters
        run: python scripts/generate.py --check
      - name: Validate registry and manifests
        run: python scripts/validate.py
