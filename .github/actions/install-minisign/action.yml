name: Install pinned minisign
description: Download and verify the pinned minisign release used by registry CI.
inputs:
  version:
    description: minisign release version
    required: false
    default: "0.12"
  sha256:
    description: SHA-256 of the Linux tarball
    required: false
    default: "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73"
runs:
  using: composite
  steps:
    - name: Download, verify, and install minisign
      shell: bash
      env:
        MINISIGN_VERSION: ${{ inputs.version }}
        MINISIGN_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/minisign-${MINISIGN_VERSION}.tar.gz"
        curl --fail --silent --show-error --location \
          "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz" \
          --output "${archive}"
        echo "${MINISIGN_SHA256}  ${archive}" | sha256sum --check --strict
        tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}"
        install -m 0755 "${RUNNER_TEMP}/minisign-linux/x86_64/minisign" "${RUNNER_TEMP}/minisign"
        echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
        echo "MINISIGN_BIN=${RUNNER_TEMP}/minisign" >> "${GITHUB_ENV}"
        "${RUNNER_TEMP}/minisign" -v
